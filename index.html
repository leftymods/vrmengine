<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VRM Viewer</title>
<style>
  :root {
    --bg: #121318;
    --panel: #1a1b21;
    --line: #2a2c34;
    --text: #dcdde2;
    --muted: #8b8f9c;
    --accent: #4f8ff7;
    --danger: #e5635f;
    --ok: #58b36b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
  canvas { display: block; }

  #panel {
    position: fixed; top: 16px; left: 16px; z-index: 10; width: 300px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; font-size: 13px; line-height: 1.5;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: var(--line); }

  #panel > div { margin-bottom: 16px; }
  #panel > div:last-child { margin-bottom: 0; }

  .sep { border-top: 1px solid var(--line); margin: 0 !important; }
  .sec-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }

  label { font-size: 12px; display: block; margin-bottom: 6px; }
  input[type="text"], input[type="url"] {
    width: 100%; background: #0f1013; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 9px; font-size: 12px; outline: none; margin-bottom: 6px;
  }
  input[type="text"]:focus, input[type="url"]:focus { border-color: var(--accent); }
  input[type="file"] { font-size: 11px; color: var(--muted); width: 100%; margin-bottom: 6px; }

  .row { display: flex; gap: 6px; }
  .btn {
    flex: 1; background: #22242c; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: default; }

  select {
    width: 100%; background: #0f1013; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 7px 9px; font-size: 12px; outline: none;
  }

  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 6px; }
  .check input { margin: 0; accent-color: var(--accent); }
  .check span { font-size: 12px; }

  .small { font-size: 11.5px; }
  #info { color: var(--accent); word-break: break-all; }
  #status { color: var(--muted); word-break: break-all; min-height: 17px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--danger); }

  #progress { height: 4px; background: #0f1013; border-radius: 2px; overflow: hidden; display: none; margin: 6px 0; }
  #progress > div { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    background: #22242c; border: 1px solid var(--line); color: var(--muted);
    border-radius: 4px; padding: 5px 9px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .pill:hover { color: var(--text); border-color: var(--accent); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .expr { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .expr span { width: 82px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .expr input[type="range"] { flex: 1; accent-color: var(--accent); }
  .expr output { width: 26px; font-size: 11px; text-align: right; color: var(--muted); }
  #exprs { max-height: 170px; overflow-y: auto; }
  #exprs:empty::before { content: '—'; color: var(--muted); font-size: 11px; }
  .hint { font-size: 10.5px; color: var(--muted); }
</style>
</head>
<body>

<div id="panel">
  <div>
    <div class="sec-label">Модель</div>
    <input type="url" id="url" placeholder="URL .vrm или .vrma" />
    <input type="file" id="file" accept=".vrm,.vrma" />
    <div class="row">
      <button class="btn primary" id="load">Загрузить</button>
      <button class="btn" id="sample">Пример pixiv</button>
    </div>
    <div id="progress"><div></div></div>
    <div class="small" id="info"></div>
    <div class="small" id="status">Перетащите файл в окно</div>
  </div>

  <div class="sep"></div>

  <div>
    <div class="sec-label">Анимация (VRMA)</div>
    <select id="animSelect">
      <option value="">Нет</option>
      <option value="Angry">Злость</option>
      <option value="Blush">Смущение</option>
      <option value="Clapping">Аплодисменты</option>
      <option value="Goodbye">Прощание</option>
      <option value="Jump">Прыжок</option>
      <option value="LookAround">Осмотреться</option>
      <option value="Relax">Расслабление</option>
      <option value="Sad">Грусть</option>
      <option value="Sleepy">Сонливость</option>
      <option value="Surprised">Удивление</option>
      <option value="Thinking">Раздумье</option>
    </select>
    <label class="check" style="margin-top:8px"><input type="checkbox" id="optIdle" checked /><span>Дыхание и покачивание</span></label>
    <div class="pills">
      <button class="pill active" id="blinkBtn" type="button">Моргание: вкл</button>
      <button class="pill active" id="blinkTo1Btn" type="button">До 1: вкл</button>
    </div>
  </div>

  <div class="sep"></div>

  <div>
    <div class="sec-label">Персонаж</div>
    <label class="check"><input type="checkbox" id="optLookAt" checked /><span>Следить глазами за курсором</span></label>
    <label class="check"><input type="checkbox" id="optFirstPerson" /><span>Вид от первого лица</span></label>
    <label class="check"><input type="checkbox" id="optHelpers" /><span>Показать кости</span></label>
    <div class="row"><button class="btn" id="eyesCenter">Глаза прямо</button></div>
  </div>

  <div class="sep"></div>

  <div>
    <div class="sec-label">Мимика</div>
    <div class="pills" id="presets" style="margin-bottom:8px"></div>
    <div id="exprs"></div>
  </div>

  <div class="sep"></div>
  <div class="hint">ЛКМ — вращение · колесо — зум · ПКМ — панорама</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/": "./node_modules/three/",
    "three/addons/": "./node_modules/three/examples/jsm/",
    "@pixiv/three-vrm": "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js",
    "@pixiv/three-vrm-core": "./node_modules/@pixiv/three-vrm-core/lib/three-vrm-core.module.js",
    "@pixiv/three-vrm-materials-mtoon": "./node_modules/@pixiv/three-vrm-materials-mtoon/lib/three-vrm-materials-mtoon.module.js",
    "@pixiv/three-vrm-animation": "./node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { createVRMAnimationClip, VRMAnimationLoaderPlugin, VRMLookAtQuaternionProxy } from '@pixiv/three-vrm-animation';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
camera.position.set(0, 1.0, 5.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.screenSpacePanning = true;
controls.target.set(0, 1.0, 0);
controls.update();

const scene = new THREE.Scene();
const helperRoot = new THREE.Group();
helperRoot.renderOrder = 10000;
helperRoot.visible = false;
scene.add(helperRoot);

const light = new THREE.DirectionalLight(0xffffff, Math.PI);
light.position.set(1, 1, 1).normalize();
scene.add(light);
scene.add(new THREE.GridHelper(10, 10));
scene.add(new THREE.AxesHelper(5));

const lookAtTarget = new THREE.Object3D();
camera.add(lookAtTarget);

window.__renderer = renderer;
window.__scene = scene;
window.__camera = camera;
window.__manualExprs = null;
window.__setManualExpr = (name, val) => { manualExprs[name] = val; };

let vrm = null;
let mixer = null;
let vrmaAction = null;
let lookAtQuatProxy = null;
let firstPersonReady = false;
const manualExprs = {};
let blinkOn = true;
let blinkTo1On = true;

const loader = new GLTFLoader();
loader.crossOrigin = 'anonymous';
loader.register(parser => new VRMLoaderPlugin(parser, { helperRoot }));
loader.register(parser => new VRMAnimationLoaderPlugin(parser));

const $ = id => document.getElementById(id);

function setStatus(text, cls) { const el = $('status'); el.textContent = text; el.className = cls ? 'small ' + cls : 'small'; }
function setInfo(text) { $('info').textContent = text; }
function setProgress(p) {
  const bar = $('progress');
  bar.style.display = 'block';
  bar.firstElementChild.style.width = (p * 100).toFixed(1) + '%';
  if (p >= 1) setTimeout(() => bar.style.display = 'none', 400);
}

function exprNames(v) {
  const map = {};
  for (const e of (v.expressionManager.expressions || [])) {
    if (e.expressionName) map[e.expressionName.toLowerCase()] = e.expressionName;
  }
  return map;
}

function buildExpressions(v) {
  const box = $('exprs');
  const presets = $('presets');
  box.innerHTML = '';
  presets.innerHTML = '';
  const map = exprNames(v);
  const list = v.expressionManager.expressions.filter(e => e.expressionName);

  for (const e of list) {
    const row = document.createElement('label');
    row.className = 'expr';
    const span = document.createElement('span');
    span.textContent = e.expressionName;
    const range = document.createElement('input');
    range.type = 'range'; range.min = 0; range.max = 1; range.step = 0.01; range.value = 0;
    const out = document.createElement('output');
    out.textContent = '0';
    range.addEventListener('input', () => {
      const val = parseFloat(range.value);
      v.expressionManager.setValue(e.expressionName, val);
      if (val > 0) manualExprs[e.expressionName] = val; else delete manualExprs[e.expressionName];
      out.textContent = val;
    });
    row.append(span, range, out);
    box.appendChild(row);
  }

  const sync = () => {
    box.querySelectorAll('.expr').forEach(row => {
      const name = row.querySelector('span').textContent;
      const real = map[name.toLowerCase()];
      const w = real ? v.expressionManager.getExpression(real).weight : 0;
      const r = row.querySelector('input[type=range]');
      r.value = w;
      row.querySelector('output').textContent = w.toFixed(2);
    });
  };

  const resetAll = () => {
    for (const k of Object.keys(manualExprs)) delete manualExprs[k];
    v.expressionManager.resetValues();
  };

  const setExpr = (name, val) => {
    const real = map[name.toLowerCase()];
    if (!real) return false;
    v.expressionManager.setValue(real, val);
    if (val > 0) manualExprs[real] = val; else delete manualExprs[real];
    return true;
  };

  // presets are exclusive: applying one clears all previously set expressions
  const presetsDef = [
    ['Спокойствие', () => {}],
    ['Радость', () => setExpr('happy', 1)],
    ['Злость', () => setExpr('angry', 1)],
    ['Грусть', () => setExpr('sad', 1)],
    ['Удивление', () => {
      if (!setExpr('surprised', 1)) { setExpr('aa', 1); setExpr('lookUp', 0.7); }
    }],
    ['Подмигивание', () => setExpr('blinkLeft', 1)],
    ['Рот', () => setExpr('aa', 1)],
  ];
  for (const [label, fn] of presetsDef) {
    const b = document.createElement('button');
    b.className = 'pill';
    b.textContent = label;
    b.addEventListener('click', () => { resetAll(); fn(); sync(); });
    presets.appendChild(b);
  }
}

function stopVrma() {
  if (vrmaAction) { vrmaAction.stop(); vrmaAction = null; }
  if (vrm && lookAtQuatProxy) vrm.lookAt.target = lookAtTarget;
  $('animSelect').value = '';
}

function clearModel() {
  stopVrma();
  if (mixer) { mixer.stopAllAction(); mixer = null; }
  if (vrm) {
    scene.remove(vrm.scene);
    VRMUtils.deepDispose(vrm.scene);
    vrm = null;
  }
  lookAtQuatProxy = null;
  for (const k of Object.keys(manualExprs)) delete manualExprs[k];
}

function loadVrm(url) {
  setInfo('');
  setStatus('Загрузка…');
  loader.load(url,
    gltf => {
      clearModel();
      vrm = gltf.userData.vrm;
      if (!vrm) { setStatus('Не VRM-файл', 'err'); return; }

      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      VRMUtils.combineMorphs(vrm);
      vrm.scene.traverse(obj => { obj.frustumCulled = false; });

      scene.add(vrm.scene);
      mixer = new THREE.AnimationMixer(vrm.scene);

      // VRMA look-at proxy (official three-vrm-animation example)
      lookAtQuatProxy = new VRMLookAtQuaternionProxy(vrm.lookAt);
      lookAtQuatProxy.name = 'lookAtQuaternionProxy';
      vrm.scene.add(lookAtQuatProxy);

      vrm.lookAt.target = lookAtTarget;

      firstPersonReady = false;
      try { vrm.firstPerson.setup(); firstPersonReady = true; }
      catch (e) { console.warn('firstPerson.setup failed', e); }
      syncFirstPerson();

      buildExpressions(vrm);

      const m = vrm.meta;
      if (m) setInfo([m.name || m.title || '?', 'v' + (m.version || '?'), m.author || ''].filter(Boolean).join(' · '));

      window.__vrm = vrm;
      setStatus('Модель загружена', 'ok');
    },
    progress => setProgress(progress.total ? progress.loaded / progress.total : 0),
    err => { setStatus('Ошибка: ' + err.message, 'err'); console.error(err); }
  );
}

async function loadVrma(name) {
  if (!vrm || !mixer || !name) return;
  if (vrmaAction) vrmaAction.stop();
  vrmaAction = null;
  setStatus('Загрузка анимации…');
  try {
    const gltf = await loader.loadAsync('./models/' + name + '.vrma');
    const vrmAnimation = gltf.userData.vrmAnimations[0];
    if (!vrmAnimation) throw new Error('нет VRMA-данных');
    const clip = createVRMAnimationClip(vrmAnimation, vrm);
    vrmaAction = mixer.clipAction(clip);
    vrmaAction.setLoop(THREE.LoopRepeat);
    vrmaAction.play();
    vrm.lookAt.target = lookAtQuatProxy;
    setStatus('Анимация: ' + name, 'ok');
  } catch (err) {
    $('animSelect').value = '';
    setStatus('Ошибка анимации: ' + err.message, 'err');
    console.error(err);
  }
}

function syncFirstPerson() {
  if (!vrm || !firstPersonReady) return;
  if ($('optFirstPerson').checked) {
    camera.layers.enable(vrm.firstPerson.firstPersonOnlyLayer);
    camera.layers.disable(vrm.firstPerson.thirdPersonOnlyLayer);
  } else {
    camera.layers.disable(vrm.firstPerson.firstPersonOnlyLayer);
    camera.layers.enable(vrm.firstPerson.thirdPersonOnlyLayer);
  }
}

// events
$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) {
    const ext = f.name.split('.').pop().toLowerCase();
    if (ext === 'vrma') loadVrma(f.name.replace(/\.vrma$/, ''));
    else loadVrm(URL.createObjectURL(f));
  }
});
$('load').addEventListener('click', () => {
  const u = $('url').value.trim();
  if (u) loadVrm(u);
});
$('sample').addEventListener('click', () => {
  loadVrm('https://raw.githubusercontent.com/pixiv/three-vrm/release/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');
});
$('animSelect').addEventListener('change', e => {
  if (e.target.value) loadVrma(e.target.value); else stopVrma();
});
$('optFirstPerson').addEventListener('change', syncFirstPerson);
$('optHelpers').addEventListener('change', e => { helperRoot.visible = e.target.checked; });
$('blinkBtn').addEventListener('click', () => {
  blinkOn = !blinkOn;
  $('blinkBtn').textContent = 'Моргание: ' + (blinkOn ? 'вкл' : 'выкл');
  $('blinkBtn').classList.toggle('active', blinkOn);
});
$('blinkTo1Btn').addEventListener('click', () => {
  blinkTo1On = !blinkTo1On;
  $('blinkTo1Btn').textContent = 'До 1: ' + (blinkTo1On ? 'вкл' : 'выкл');
  $('blinkTo1Btn').classList.toggle('active', blinkTo1On);
});
$('eyesCenter').addEventListener('click', () => {
  lookAtTarget.position.set(0, 0, 0);
  if (vrm) {
    const map = exprNames(vrm);
    for (const n of ['lookUp', 'lookDown', 'lookLeft', 'lookRight']) {
      const real = map[n];
      if (real) { vrm.expressionManager.setValue(real, 0); delete manualExprs[real]; }
    }
  }
});

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'vrma') loadVrma(f.name.replace(/\.vrma$/, ''));
  else loadVrm(URL.createObjectURL(f));
});

window.addEventListener('mousemove', event => {
  if (!$('optLookAt').checked) return;
  if (vrmaAction) return;
  lookAtTarget.position.x = 10.0 * ((event.clientX - 0.5 * window.innerWidth) / window.innerHeight);
  lookAtTarget.position.y = -10.0 * ((event.clientY - 0.5 * window.innerHeight) / window.innerHeight);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
let blinkTimer = 2.5, blinkT = 0, blinkDur = 0.13;

renderer.setAnimationLoop(() => {
  const delta = clock.getDelta();
  const t = clock.elapsedTime;

  if (vrm) {
    const idleOn = $('optIdle').checked && !vrmaAction;
    const chest = vrm.humanoid.getNormalizedBoneNode('chest');
    if (idleOn) {
      const breath = Math.sin(t * 1.6) * 0.02;
      if (chest) { chest.rotation.x = breath; chest.scale.y = 1 + breath * 0.6; }
      vrm.scene.rotation.y = Math.sin(t * 0.45) * 0.025;
    } else if (!vrmaAction) {
      if (chest) { chest.rotation.x = 0; chest.scale.set(1, 1, 1); }
      vrm.scene.rotation.y = 0;
    }

    if (blinkOn) {
      blinkTimer -= delta;
      if (blinkTimer <= 0) { blinkT = blinkDur; blinkTimer = 2 + Math.random() * 4; }
      let w = 0;
      if (blinkT > 0) {
        blinkT -= delta;
        w = Math.sin(Math.PI * (1 - Math.max(blinkT, 0) / blinkDur));
      }
      const exprs = vrm.expressionManager.expressions;
      const manualB = 'blink' in manualExprs;
      const manualL = 'blinkLeft' in manualExprs;
      const manualR = 'blinkRight' in manualExprs;
      const hasBlink = exprs.some(e => e.expressionName === 'blink');
      const hasBlinkL = exprs.some(e => e.expressionName === 'blinkLeft');
      const hasBlinkR = exprs.some(e => e.expressionName === 'blinkRight');
      if (manualL || manualR) {
        // manual eye control (e.g. wink) — blink only the free eyes, never the manual one
        if (hasBlinkL && !manualL) vrm.expressionManager.setValue('blinkLeft', w);
        if (hasBlinkR && !manualR) vrm.expressionManager.setValue('blinkRight', w);
      } else if (manualB) {
        // manual 'blink': if 'До 1' is on and blink < 1, blink overlays up to 1;
        // if blink === 1 or 'До 1' is off — never touch it
        const m = manualExprs['blink'];
        if (blinkTo1On && m < 1) {
          vrm.expressionManager.setValue('blink', Math.min(1, Math.max(m, w)));
        }
      } else if (hasBlink) {
        vrm.expressionManager.setValue('blink', w);
      } else if (hasBlinkL) {
        vrm.expressionManager.setValue('blinkLeft', w);
        vrm.expressionManager.setValue('blinkRight', w);
      }
    }

    vrm.update(delta);
  }
  if (mixer) mixer.update(delta);
  renderer.render(scene, camera);
});

// load the local test model if present
fetch('./models/mymodel.vrm').then(r => { if (r.ok) loadVrm('./models/mymodel.vrm'); }).catch(() => {});
</script>
</body>
</html>
