[package]
name = "vrmengine"
version = "0.1.0"
edition = "2021"
description = "A Rust + OpenGL port of @pixiv/three-vrm"

[dependencies]
anyhow = "1"
image = "0.25"
png = "0.17"
gl = "0.14"
glutin = "0.32"
glutin-winit = "0.5"
winit = "0.30"
raw-window-handle = "0.6"
glam = { version = "0.24", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", features = ["extensions"] }
base64 = "0.22"
thiserror = "1"
egui = "0.36"
egui-winit = "0.36"
egui_glow = { version = "0.36", features = ["winit"] }
glow = "0.17"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }
