[workspace]
members = ["crates/*", "examples/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.68"

[workspace.dependencies]
glam = "0.29"
gltf = { version = "1", features = ["utils", "extensions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vrm-spec = { git = "https://github.com/pixiv/vrm-utils-rs" }

[profile.release]
opt-level = 3
